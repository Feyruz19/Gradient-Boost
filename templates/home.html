<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Diagnosis Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .card { border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); margin-top: 50px; }
        .card-header { border-radius: 20px 20px 0 0 !important; background: #2c3e50; color: white; }
        .btn-primary { background: #667eea; border: none; padding: 12px 40px; border-radius: 50px; font-size: 18px; }
        .btn-primary:hover { background: #5a67d8; }
        .form-control, .form-select { border-radius: 12px; padding: 12px; }
        .container { max-width: 700px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header text-center py-4">
                <h2>Medical Diagnosis Assistant</h2>
                <p class="mb-0">Enter your health indicators to assess disease risk</p>
            </div>
            <div class="card-body p-4">
                <form method="post" action="{% url 'result' %}">
                    {% csrf_token %}
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Age</label>
                            <input type="number" name="Age" class="form-control" value="45" min="1" max="120" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">BMI</label>
                            <input type="number" name="BMI" class="form-control" value="28.0" step="0.1" min="10" max="60" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Glucose Level</label>
                            <input type="number" name="GlucoseLevel" class="form-control" value="120" min="40" max="300" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Blood Pressure</label>
                            <input type="number" name="BloodPressure" class="form-control" value="120" min="60" max="220" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Family History</label>
                            <select name="FamilyHistory" class="form-select">
                                <option value="0">No</option>
                                <option value="1">Yes</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Exercise Level</label>
                            <select name="ExerciseLevel" class="form-select">
                                <option value="0">Low</option>
                                <option value="1" selected>Medium</option>
                                <option value="2">High</option>
                            </select>
                        </div>
                    </div>
                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-primary">Predict Disease Risk</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
